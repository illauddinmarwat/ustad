<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ustad Admin - Sign in</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--side:#1C2321;--side2:#2A3330;--accent:#D9731A;--accent-soft:#FBE9D6;--bg:#F4F3EF;--card:#fff;--line:#E4E2DB;
--ink:#1C2321;--body:#4A524F;--muted:#8A8F8B;--ok:#2F7D4F;--ok-bg:#DFF1E5;--warn:#B7791F;--warn-bg:#FBEFD0;--bad:#B4382E;--bad-bg:#F8DEDA;}
*{box-sizing:border-box;margin:0}
body{font-family:'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--body);font-size:14px;line-height:1.45}
h1,h2,h3,.brand b,.stat .v{font-family:'Barlow Condensed',sans-serif;color:var(--ink);letter-spacing:.2px}
.app{display:flex;min-height:100vh}
aside{width:250px;background:var(--side);color:#cfd5d2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;padding:22px 20px}
.logo{width:36px;height:36px;background:var(--accent);border-radius:8px;display:grid;place-items:center;color:#fff;font:700 22px 'Barlow Condensed'}
.brand b{color:#fff;font-size:24px;line-height:1;display:block}.brand small{font-size:11px;color:#8d9793}
.navlabel{font-size:10px;letter-spacing:1.2px;color:#6f7a76;padding:14px 22px 6px;text-transform:uppercase}
nav a{display:flex;align-items:center;gap:11px;padding:10px 20px;margin:1px 10px;border-radius:6px;color:#cfd5d2;text-decoration:none;font-weight:500;border-left:3px solid transparent}
nav a:hover{background:var(--side2)}
nav a.on{background:var(--side2);color:#fff;border-left-color:var(--accent)}
nav a.on svg{stroke:var(--accent)}
nav svg{width:18px;height:18px;fill:none;stroke:#8d9793;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .n{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.side-foot{margin-top:auto;padding:16px 20px;border-top:1px solid #333d39;display:flex;gap:10px;align-items:center;font-size:12px}
.av{width:32px;height:32px;border-radius:50%;background:#3b4844;color:#fff;display:grid;place-items:center;font-weight:600;flex-shrink:0}
.side-foot a{color:#8d9793;margin-left:auto;text-decoration:none}
main{flex:1;min-width:0}
.top{height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:16px}
.crumb{color:var(--muted);font-size:13px}.crumb b{color:var(--ink);font-weight:600}
.search{margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;width:260px;color:var(--muted);font-size:13px}
.bell{position:relative;width:34px;height:34px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center}
.bell i{position:absolute;top:6px;right:7px;width:8px;height:8px;background:var(--accent);border-radius:50%}
.content{padding:28px 32px 48px;max-width:1280px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-size:36px;font-weight:700;line-height:1}
.sub{color:var(--muted);margin-top:6px;max-width:680px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.card>.ch{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.card h2{font-size:20px;font-weight:600}
.pad{padding:20px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.mb{margin-bottom:20px}
.stat{padding:18px 20px}.stat .l{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600}
.stat .v{font-size:38px;font-weight:700;margin-top:4px;line-height:1.05}.stat .s{font-size:12px;color:var(--muted);margin-top:4px}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}
table{width:100%;border-collapse:collapse;text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;padding:10px 20px;background:#FAF9F6;border-bottom:1px solid var(--line)}
td{padding:13px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td b{color:var(--ink);font-weight:600}.mut{color:var(--muted);font-size:12px}
.num{font-variant-numeric:tabular-nums;text-align:right}th.num{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.neutral{background:#ECEBE6;color:var(--body)}
.bar{height:6px;background:#ECEAE3;border-radius:4px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.btn{display:inline-block;padding:8px 16px;border-radius:6px;font:600 13px 'Public Sans';border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn.d{background:var(--bad);border-color:var(--bad);color:#fff}.btn.s{padding:5px 11px;font-size:12px}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs span{padding:9px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs span.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs em{font-style:normal;background:#ECEBE6;border-radius:10px;padding:0 7px;font-size:11px;margin-left:6px}
.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}
.input{border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:#fff;color:var(--ink);width:100%}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 24px}.dl div small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600}.dl div span{color:var(--ink);font-weight:500}
.doc{aspect-ratio:1.6;border:1px dashed #C9C6BC;border-radius:8px;background:repeating-linear-gradient(45deg,#F7F6F2,#F7F6F2 10px,#F1EFE9 10px,#F1EFE9 20px);display:grid;place-items:center;color:var(--muted);font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toggle{width:38px;height:22px;border-radius:12px;background:#CFCCC2;position:relative;flex-shrink:0}.toggle:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.toggle.on{background:var(--accent)}.toggle.on:after{left:19px}
.item{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.item .t{color:var(--ink);font-weight:600}
.chart{display:flex;align-items:flex-end;gap:14px;height:190px;padding:10px 20px 0}
.chart div{flex:1;text-align:center;font-size:11px;color:var(--muted)}.chart div i{display:block;background:#E8C9A8;border-radius:4px 4px 0 0;margin-bottom:6px}.chart div.last i{background:var(--accent)}
.note{background:var(--accent-soft);border:1px solid #F0CDA6;border-radius:8px;padding:12px 16px;color:#7A4510;margin-bottom:20px}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .l{background:var(--side);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.login .l h1{color:#fff;font-size:64px;line-height:.95;max-width:420px}.login .l h1 em{color:var(--accent);font-style:normal}
.login .r{display:grid;place-items:center;padding:40px}.login .box{width:100%;max-width:380px}
@media(max-width:900px){aside{display:none}.g4,.g3,.g2,.dl{grid-template-columns:1fr 1fr}.login{grid-template-columns:1fr}.login .l{display:none}.search{display:none}}
</style></head><body><div class="login"><div class="l"><div class="brand" style="padding:0"><div class="logo">U</div><div><b>Ustad</b><small>استاد — Admin</small></div></div><div><h1>Every job. Every rupee. <em>Accounted for.</em></h1><p style="color:#8d9793;margin-top:18px;max-width:380px">Approve workers, verify payments, chase dues and resolve disputes from one console.</p></div><small style="color:#6f7a76">© Ustad Marketplace</small></div><div class="r"><div class="box"><h1 style="font-size:40px">Sign in</h1><p class="sub mb">Admin accounts only.</p><div class="field"><label>Email</label><div class="input">admin@ustad.pk</div></div><div class="field"><label>Password</label><div class="input">••••••••••</div></div><a href="approvals.html" class="btn p" style="display:block;text-align:center;padding:11px;margin-top:8px;text-decoration:none">Sign in</a><p class="hint" style="margin-top:14px">Signed in but not an admin? You will be returned here.</p></div></div></div></body></html>
