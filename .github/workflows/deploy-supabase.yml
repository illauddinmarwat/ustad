name: Deploy Supabase migrations

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'supabase/migrations/**'

jobs:
  db-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      # Connects straight to Postgres with a connection string, so no
      # personal access token (which expires) and no `supabase link` needed.
      - name: Push migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
